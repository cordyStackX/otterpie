<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Otterpie logo: an otter holding a pie" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Small ears, set wide and low like an otter -->
  <circle cx="11.5" cy="20" r="4" fill="#5E3A1B"/>
  <circle cx="52.5" cy="20" r="4" fill="#5E3A1B"/>
  <circle cx="11.5" cy="20" r="1.8" fill="#C98B5A"/>
  <circle cx="52.5" cy="20" r="1.8" fill="#C98B5A"/>

  <!-- Broad, flat head -->
  <ellipse cx="32" cy="30" rx="22" ry="16" fill="#7A4A21"/>
  <!-- Forehead highlight -->
  <ellipse cx="32" cy="21" rx="12" ry="4" fill="#8F5A2C"/>

  <!-- Cream muzzle and cheeks -->
  <ellipse cx="32" cy="36" rx="15" ry="9.5" fill="#F0D9B5"/>
  <!-- Whisker pads -->
  <circle cx="26" cy="37" r="5" fill="#F8E8CB"/>
  <circle cx="38" cy="37" r="5" fill="#F8E8CB"/>

  <!-- Eyes, close-set -->
  <circle cx="24" cy="27.5" r="2.4" fill="#2B1A0E"/>
  <circle cx="40" cy="27.5" r="2.4" fill="#2B1A0E"/>
  <circle cx="24.8" cy="26.6" r="0.8" fill="#fff"/>
  <circle cx="40.8" cy="26.6" r="0.8" fill="#fff"/>

  <!-- Wide otter nose -->
  <path d="M27.5 32.2c0-1.6 2-2.4 4.5-2.4s4.5.8 4.5 2.4c0 1.8-2.2 3.2-4.5 3.2s-4.5-1.4-4.5-3.2z" fill="#2B1A0E"/>
  <ellipse cx="30.4" cy="31.2" rx="1.2" ry=".6" fill="#6B4A32"/>
  <!-- Mouth with tiny smile -->
  <path d="M32 35.4v1.6M32 37c-1.3 1.5-3.4 1.5-4.4 0M32 37c1.3 1.5 3.4 1.5 4.4 0" fill="none" stroke="#2B1A0E" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Whiskers -->
  <g stroke="#5E3A1B" stroke-width=".8" stroke-linecap="round" fill="none">
    <path d="M22 36.5 12 34.5M22 38.5 11.5 39M22.5 40.5 13.5 43"/>
    <path d="M42 36.5 52 34.5M42 38.5 52.5 39M41.5 40.5 50.5 43"/>
  </g>
  <g fill="#7A4A21">
    <circle cx="24" cy="36" r=".6"/><circle cx="27" cy="38.5" r=".6"/>
    <circle cx="40" cy="36" r=".6"/><circle cx="37" cy="38.5" r=".6"/>
  </g>

  <!-- Pie dish -->
  <path d="M10 48h44l-4.5 11h-35z" fill="#D9892B"/>
  <path d="M10 48h44l-1.4 3.6H11.4z" fill="#B96F1B" opacity=".35"/>

  <!-- Pie top crust -->
  <ellipse cx="32" cy="48" rx="22" ry="5.6" fill="#F2B84B"/>
  <ellipse cx="32" cy="47" rx="16" ry="3.5" fill="#F7CB72"/>
  <path d="M25 46.5l2 1.5M32 45.8v2.4M39 46.5l-2 1.5" fill="none" stroke="#B96F1B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Crimped edge -->
  <g fill="#E6A238">
    <circle cx="12" cy="49" r="1.6"/><circle cx="17" cy="51.6" r="1.6"/>
    <circle cx="23" cy="53" r="1.6"/><circle cx="29" cy="53.7" r="1.6"/>
    <circle cx="35" cy="53.7" r="1.6"/><circle cx="41" cy="53" r="1.6"/>
    <circle cx="47" cy="51.6" r="1.6"/><circle cx="52" cy="49" r="1.6"/>
  </g>

  <!-- Webbed paws gripping the pie -->
  <ellipse cx="12" cy="46.5" rx="5" ry="3.8" fill="#5E3A1B"/>
  <ellipse cx="52" cy="46.5" rx="5" ry="3.8" fill="#5E3A1B"/>
  <path d="M9.6 45.6v2M12 44.9v2.6M14.4 45.6v2M49.6 45.6v2M52 44.9v2.6M54.4 45.6v2" stroke="#3A230F" stroke-width=".9" stroke-linecap="round"/>
</svg>
